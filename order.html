<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داواکردنی یاری - کەتەلۆگ</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .order-box { background: #1e1e1e; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        h2 { color: #00d2ff; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { background: #25d366; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { background: #1ebe5d; }
        .back-link { display: block; margin-top: 15px; color: #00d2ff; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="order-box">
        <h2>تۆمارکردنی داواکاری</h2>
        <form onsubmit="submitOrder(event)">
            <input type="text" id="customerName" placeholder="ناوی تەواوی خۆت" required>
            <input type="text" id="customerPhone" placeholder="ژمارەی مۆبایل (واتسئاپ)" required>
            <input type="text" id="gameOrdered" placeholder="ناوی ئەو یارییەی دەتەوێت" required>
            <button type="submit">ناردنی داواکاری</button>
        </form>
        <a href="index.html" class="back-link">← گەڕانەوە بۆ کەتەلۆگ</a>
    </div>

    <script>
        function submitOrder(event) {
            event.preventDefault();
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const game = document.getElementById('gameOrdered').value;

            // لێرەدا دەتوانیت نامەکە ڕاستەوخۆ بنێریت بۆ واتسئاپت یان پەیامێکی سەرکەوتوو نیشان بدەیت
            const message = `سڵاو، ناوم ${name}ـە. دەمەوێت یاری (${game}) داوا بکەم. ژمارەی مۆبایل: ${phone}`;
            const whatsappUrl = `https://wa.me/9647500000000?text=${encodeURIComponent(message)}`;
            
            alert('داواکارییەکەت سەرکەوتوو بوو! ئێستا دەنێردرێ بۆ واتسئاپ.');
            window.location.href = whatsappUrl;
        }
    </script>

</body>
</html>
