<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کەتەلۆگی یارییەکانی PS4 و PS5</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #00d2ff; margin-bottom: 30px; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .game-card { background: #1e1e1e; border-radius: 10px; width: 300px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; padding-bottom: 15px; }
        .game-card img { width: 100%; height: 200px; object-fit: cover; }
        .game-card h3 { margin: 10px 0; color: #fff; }
        .game-card p { color: #aaa; font-size: 14px; }
        .game-card iframe { width: 100%; height: 170px; border: none; margin-top: 10px; }
        .order-btn { display: inline-block; background: #ff9800; color: white; padding: 10px 20px; margin-top: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .order-btn:hover { background: #e68900; }
        .no-games { text-align: center; color: #777; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>

    <h1>کەتەلۆگی یارییەکانی PS4 و PS5</h1>

    <!-- پێڕستی یارییەکان کە کڕیارەکان دەبینن -->
    <div class="container" id="gamesContainer"></div>

    <script>
        window.onload = function() {
            const container = document.getElementById('gamesContainer');
            let games = JSON.parse(localStorage.getItem('myGames')) || [];

            if (games.length === 0) {
                container.innerHTML = '<div class="no-games">هیچ یارییەک لە کەتەلۆگدا نییە لە ئێستادا.</div>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.image}" alt="${game.name}">
                    <h3>${game.name}</h3>
                    <p>پلاتفۆرم: ${game.platform}</p>
                    <iframe src="${game.video}" allowfullscreen></iframe>
                    <br>
                    <a href="order.html" class="order-btn">داواکردن و کڕین</a>
                `;
                container.appendChild(card);
            });
        };
    </script>
</body>
</html>
